name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.cpu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cpu: [native, x86-64]
    env:
      CARGO_INCREMENTAL: "0"
      # Override the local native default to also compile/test the portable
      # baseline. Explicit scalar-kernel tests run in both configurations.
      RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Offline example-download tests
        run: python3 -m unittest discover -s tests -p 'test_bacteria_example.py'
      - name: Test
        run: cargo test --workspace --release --locked
      - name: Build command-line tools
        run: cargo build --workspace --release --locked --bins
      - name: Checked demonstration
        run: bash utils/scripts/demo.sh "$RUNNER_TEMP/zindex-demo-${{ matrix.cpu }}"
      - name: Check benchmark recorder on tiny inputs
        run: >-
          python3 utils/scripts/benchmark_zindex.py
          --fof tests/data/tiny/samples.fof
          --positive tests/data/tiny/a-only.fa --negative tests/data/tiny/negative.fa
          --threads 2 --hash-inputs --hash-index
          --output "$RUNNER_TEMP/zindex-recorder-${{ matrix.cpu }}"
      - name: Preserve failed example logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: example-logs-${{ matrix.cpu }}
          path: |
            ${{ runner.temp }}/zindex-demo-${{ matrix.cpu }}/
            ${{ runner.temp }}/zindex-recorder-${{ matrix.cpu }}/
            !${{ runner.temp }}/zindex-recorder-${{ matrix.cpu }}/*.binary

name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.cpu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cpu: [native, x86-64]
    env:
      CARGO_INCREMENTAL: "0"
      # Override the local native default to also compile/test the portable
      # baseline. Explicit scalar-kernel tests run in both configurations.
      RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - name: Validate
        run: bash utils/scripts/validate.sh '${{ matrix.cpu }}'
      - name: Check benchmark recorder
        run: >-
          python3 utils/scripts/benchmark_zindex.py
          --fof tests/data/bacteria/samples.fof
          --positive tests/data/bacteria/positive.fa --negative tests/data/bacteria/negative.fa
          --threads 2 --hash-inputs --hash-index
          --binary target/validation/${{ matrix.cpu }}/release/zorindex
          --output "$RUNNER_TEMP/zindex-recorder-${{ matrix.cpu }}"
      - name: Preserve failed example logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: example-logs-${{ matrix.cpu }}
          path: |
            ${{ runner.temp }}/zindex-validation-${{ matrix.cpu }}.*/
            ${{ runner.temp }}/zindex-recorder-${{ matrix.cpu }}/
            !${{ runner.temp }}/zindex-recorder-${{ matrix.cpu }}/*.binary

[package]
name = "minimizer-fasta"
version = "0.1.0"
edition = "2021"
description = "Parallel, streaming canonical SIMD minimizer FASTA generator"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0"
ocm-minimizers = { version = "0.1.0", path = "../ocm-minimizers" }
helicase = { version = "0.1.1", path = "../../vendor/helicase", default-features = false }
clap = { version = "4.5", features = ["derive"] }
deko = { version = "0.6", default-features = false, features = ["flate2", "zstd", "xz", "bzip2"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
itoa = "1.0"
packed-seq = "=4.4.2"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-minimizers = "=2.3.1"

# Keep a portable correctness fallback when AVX2/NEON is unavailable. Native
# builds inherit the workspace target-cpu=native and fat-LTO release profile.
[target.'cfg(not(any(target_feature = "avx2", target_feature = "neon")))'.dependencies]
simd-minimizers = { version = "=2.3.1", features = ["scalar"] }
